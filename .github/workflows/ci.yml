name: CITLARA CI
on: [push, pull_request]

jobs:
  test-rails:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://citlara:citlara@localhost:5432/citlara_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: citlara
          POSTGRES_PASSWORD: citlara
          POSTGRES_DB: citlara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Wait for PostgreSQL
        run: sleep 5
      - run: bundle exec rails db:create db:migrate
      - run: bundle exec rspec --format progress
      - run: bundle exec cucumber

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: |
          pip install pytest
          pip install -r motor_linguistico/requirements.txt
      - run: pytest motor_linguistico/tests/ -v
